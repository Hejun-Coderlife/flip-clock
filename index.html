<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>赫眉 · 翻页时钟</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#eaa8b1">
<meta name="description" content="赫眉 HYMN 翻页时钟 · 倒计时，门店大屏可用">
<meta property="og:type" content="website">
<meta property="og:title" content="赫眉 · 翻页时钟">
<meta property="og:description" content="翻页时钟 + 倒计时，彩妆图案动态背景">
<meta property="og:image" content="https://hejun-coderlife.github.io/flip-clock/og-image.png">
<meta property="og:url" content="https://hejun-coderlife.github.io/flip-clock/">
<style>
  :root{
    --bg:#eaa8b1;          /* 背景色（可切换）：赫眉品牌粉 */
    --card:#e2949f;        /* 卡片色 */
    --digit:#ffffff;       /* 数字色 */
    --line:rgba(255,255,255,.28);  /* 中缝细线 */
    --gap:0.34em;          /* 卡片间距 */
    --radius:0.14em;
    --dur:520ms;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{height:100%;}

  body{
    background:var(--bg);
    background-image:radial-gradient(115% 75% at 50% 12%, rgba(255,255,255,.16), rgba(255,255,255,0) 60%), radial-gradient(90% 60% at 50% 108%, rgba(0,0,0,.14), rgba(0,0,0,0) 65%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC",sans-serif;
    font-weight:700;
    -webkit-font-smoothing:antialiased;
    transition:background-color .5s ease;
    cursor:default;
  }
  body.idle{cursor:none;}

  /* ---------- 背景：WebGL 画布 ---------- */
  #bg{
    position:fixed;inset:0;
    width:100%;height:100%;
    display:block;
    z-index:0;
    pointer-events:none;
  }
  #bg.off{display:none;}

  /* ---------- 背景：漂浮的彩妆 / 护肤图案 ---------- */
  #pattern{
    position:fixed;inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
  }
  #pattern.off{display:none;}

  .p-item{
    position:absolute;
    bottom:-24vh;
    animation:rise linear infinite;
    will-change:transform;            /* 只动 transform，全程交给 GPU 合成 */
  }
  @keyframes rise{
    from{ transform:translate3d(0, 0, 0); }
    to  { transform:translate3d(0, -140vh, 0); }
  }

  .p-spin{
    width:100%;height:100%;
    animation:sway ease-in-out infinite alternate;
  }
  @keyframes sway{
    from{ transform:translateX(-11px) rotate(-6deg); }
    to  { transform:translateX(11px)  rotate(6deg); }
  }

  /* 微光点缀：一边慢慢转一边呼吸 */
  .p-star{
    width:100%;height:100%;
    animation:twinkle ease-in-out infinite alternate;
  }
  @keyframes twinkle{
    from{ transform:scale(.72) rotate(-12deg); opacity:.35; }
    to  { transform:scale(1.06) rotate(14deg); opacity:1; }
  }

  .p-item svg{
    width:100%;height:100%;
    fill:none;
    stroke:var(--digit);
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  /* 近的画细、远的画粗，看上去线条粗细才一致 */
  .p-item.d0 svg{stroke-width:2.2;}
  .p-item.d1 svg{stroke-width:2.9;}
  .p-item.d2 svg{stroke-width:3.6;}
  .p-item.star svg{stroke-width:2.4;}

  body.paused .p-item,
  body.paused .p-spin,
  body.paused .p-star{animation-play-state:paused;}

  /* 版本标签（只在 v1~v5 预览版里出现） */
  .vtag{
    position:fixed;top:20px;left:22px;
    color:rgba(255,255,255,.75);
    font:600 12px/1 "Helvetica Neue",Helvetica,Arial,"PingFang SC",sans-serif;
    letter-spacing:.12em;
    z-index:10;opacity:.8;
    transition:opacity .4s ease;
  }
  body.idle .vtag{opacity:0;}

  /* ---------- 时钟 ---------- */
  .clock{
    position:relative;
    display:flex;
    gap:var(--gap);
    font-size:clamp(38px, 13.5vw, 15.5vh);   /* 1em = 卡片高度基准 */
    line-height:1;
    user-select:none;
    z-index:2;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.22));
  }

  /* 横穿整排的细线（含卡片之间的缝隙） */
  .clock::after{
    content:"";
    position:absolute;
    left:-4%;right:-4%;
    top:50%;
    height:2px;
    transform:translateY(-1px);
    background:var(--line);
    pointer-events:none;
    z-index:3;
  }

  .card{
    position:relative;
    width:2.18em;
    height:2.15em;
    perspective:22em;
    border-radius:var(--radius);
  }
  .card.single{width:1.55em;}

  .half{
    position:absolute;
    left:0;
    width:100%;
    height:50%;
    overflow:hidden;
    background:var(--card);
    backface-visibility:hidden;
  }
  /* span 高度 = 200% 半张 = 整张卡片高，用 flex 居中，
     数字中心正好落在卡片中缝上，上下半张各裁一半 */
  .half span{
    position:absolute;
    left:0;
    width:100%;
    height:200%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.78em;          /* 数字大小 */
    letter-spacing:-.03em;
    color:var(--digit);
  }
  .card.single .half span{font-size:1.9em;}

  .top{top:0;border-radius:var(--radius) var(--radius) 0 0;}
  .top span{top:0;}
  .bottom{bottom:0;border-radius:0 0 var(--radius) var(--radius);}
  .bottom span{bottom:0;}

  /* 上下半张之间的接缝 */
  .bottom::before{
    content:"";position:absolute;left:0;top:0;width:100%;height:2px;
    background:rgba(0,0,0,.18);
  }

  /* 翻页用的两张活动片 */
  .flip-top,.flip-bottom{z-index:2;}
  .flip-top{transform-origin:50% 100%;}
  .flip-bottom{transform-origin:50% 0%;transform:rotateX(90deg);}

  .flipping .flip-top{animation:flipTop calc(var(--dur)/2) cubic-bezier(.36,0,.66,-.05) forwards;}
  .flipping .flip-bottom{animation:flipBottom calc(var(--dur)/2) cubic-bezier(.34,1.05,.64,1) calc(var(--dur)/2) forwards;}

  @keyframes flipTop{
    0%{transform:rotateX(0deg);filter:brightness(1);}
    100%{transform:rotateX(-90deg);filter:brightness(.72);}
  }
  @keyframes flipBottom{
    0%{transform:rotateX(90deg);filter:brightness(.72);}
    100%{transform:rotateX(0deg);filter:brightness(1);}
  }

  /* AM / PM */
  .meridiem{
    position:absolute;
    top:.30em;left:.26em;
    font-size:.32em;
    letter-spacing:.01em;
    color:var(--digit);
    z-index:4;
  }
  .meridiem.hidden{display:none;}

  /* ---------- 控件 ---------- */
  .controls{
    position:fixed;
    right:24px;bottom:22px;
    display:flex;align-items:center;gap:14px;
    opacity:.55;
    transition:opacity .4s ease;
    z-index:10;
  }
  body.idle .controls{opacity:0;pointer-events:none;}

  .swatches{display:flex;gap:9px;}
  .sw{
    width:16px;height:16px;border-radius:50%;
    border:1px solid rgba(255,255,255,.28);
    cursor:pointer;padding:0;
    transition:transform .15s ease;
  }
  .sw:hover{transform:scale(1.18);}
  .sw.on{box-shadow:0 0 0 2px rgba(255,255,255,.55);}

  .btn{
    background:none;border:none;cursor:pointer;
    color:rgba(255,255,255,.9);font:700 13px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;
    letter-spacing:.04em;
    padding:5px 8px;border-radius:5px;
    transition:color .2s ease,background .2s ease;
  }
  .btn:hover{color:#fff;background:rgba(255,255,255,.08);}
  .btn.on{background:rgba(255,255,255,.16);color:#fff;}

  /* ---------- 背景选择菜单 ---------- */
  .menu{
    position:fixed;
    right:24px;bottom:60px;
    background:rgba(20,14,16,.9);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.14);
    border-radius:11px;
    padding:7px;
    display:none;
    z-index:22;
    box-shadow:0 16px 44px rgba(0,0,0,.32);
  }
  .menu.show{display:block;}
  .menu button{
    display:block;width:100%;
    background:none;border:none;cursor:pointer;
    color:rgba(255,255,255,.8);
    font:600 13px/1 "Helvetica Neue",Helvetica,Arial,"PingFang SC",sans-serif;
    text-align:left;letter-spacing:.04em;
    padding:9px 26px 9px 12px;border-radius:7px;
    white-space:nowrap;
    transition:background .16s ease,color .16s ease;
  }
  .menu button:hover{background:rgba(255,255,255,.12);color:#fff;}
  .menu button.on{color:#fff;}
  .menu button.on::after{content:" ✓";color:#fff;}
  .btn.hidden{display:none;}
  .btn.icon{padding:6px;line-height:0;}
  .btn.icon svg{width:16px;height:16px;fill:rgba(255,255,255,.9);display:block;}
  .btn.icon:hover svg{fill:#fff;}

  /* ---------- 倒计时设置面板 ---------- */
  .panel{
    position:fixed;inset:0;
    display:none;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.45);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    z-index:20;
  }
  .panel.show{display:flex;}
  .panel-box{
    background:rgba(20,14,16,.86);
    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;
    padding:26px 28px 22px;
    text-align:center;
    color:#fff;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .panel-title{font-size:13px;letter-spacing:.18em;opacity:.6;margin-bottom:16px;}
  .time-inputs{display:flex;align-items:center;justify-content:center;gap:6px;}
  .time-inputs input{
    width:76px;height:64px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    border-radius:9px;
    color:#fff;text-align:center;
    font:700 30px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;
    outline:none;
  }
  .time-inputs input:focus{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.14);}
  .time-inputs .colon{font-size:26px;opacity:.5;padding:0 2px;}
  .unit-row{display:flex;justify-content:center;gap:6px;margin-top:6px;font-size:11px;opacity:.45;letter-spacing:.1em;}
  .unit-row span{width:76px;}
  .unit-row .sp{width:14px;}

  .presets{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 16px;max-width:280px;}
  .chip{
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.14);
    color:#fff;cursor:pointer;
    font:600 12px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;
    padding:7px 11px;border-radius:20px;
    transition:background .18s ease;
  }
  .chip:hover{background:rgba(255,255,255,.24);}

  .until{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;}
  .until span{opacity:.6;letter-spacing:.08em;}
  .until i{font-style:normal;opacity:.5;font-size:18px;}
  .until input{
    width:46px;height:36px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:7px;
    color:#fff;text-align:center;outline:none;
    font:700 17px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  .until input::placeholder{color:rgba(255,255,255,.3);font-weight:500;font-size:13px;}
  .until input:focus{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.14);}
  .until-hint{min-height:18px;margin:8px 0 16px;font-size:12px;opacity:.6;letter-spacing:.04em;}
  .panel-actions{display:flex;gap:10px;justify-content:center;}
  .pbtn{
    cursor:pointer;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);color:#fff;
    font:700 13px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;
    padding:10px 22px;border-radius:8px;
    transition:background .18s ease;
  }
  .pbtn:hover{background:rgba(255,255,255,.2);}
  .pbtn.primary{background:#fff;color:#2b1c20;border-color:#fff;}
  .pbtn.primary:hover{background:rgba(255,255,255,.85);}

  /* 到点闪烁 */
  .flash{
    position:fixed;inset:0;background:#fff;opacity:0;
    pointer-events:none;z-index:15;
  }
  body.alarm .flash{animation:alarmFlash 1s ease-in-out 6;}
  @keyframes alarmFlash{0%,100%{opacity:0;}50%{opacity:.55;}}

  /* 倒计时模式下点数字可设置时间 */
  body.timer .clock{cursor:pointer;}

  /* ---------- LOGO ---------- */
  .logo{
    position:fixed;
    top:5.5vh;left:50%;
    transform:translateX(-50%);
    width:min(300px,42vw);
    opacity:.92;
    pointer-events:none;
    z-index:5;
  }
  .logo img{display:block;width:100%;height:auto;}

  .fsb{display:inline-flex;align-items:center;gap:6px;}
  .fsb svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;fill:none;}
  .toast{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
    background:rgba(20,14,16,.9);color:#fff;border:1px solid rgba(255,255,255,.14);
    font:600 13px/1.5 "Helvetica Neue","PingFang SC",sans-serif;
    padding:9px 16px;border-radius:9px;z-index:30;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .toast.show{opacity:1;}

  @media (max-width:640px){
    .controls{right:14px;bottom:14px;gap:10px;}
    .logo{top:8vh;width:60vw;}
  }
</style>
</head>
<body>

  <!-- 图标库：彩妆 / 护肤 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- 口红：斜切膏体 + 卡箍 + 管身 -->
      <symbol id="ic-lipstick" viewBox="0 0 100 100">
        <path d="M37 50 V30 L54 18 L65 27 V50"/>
        <path d="M37 40 L65 34"/>
        <rect x="36" y="50" width="28" height="9" rx="2"/>
        <path d="M38 59 V83 a4 4 0 0 0 4 4 h16 a4 4 0 0 0 4-4 V59"/>
      </symbol>

      <!-- 香水：圆肩瓶 + 标签 + 喷头气囊 -->
      <symbol id="ic-perfume" viewBox="0 0 100 100">
        <path d="M32 54 a18 18 0 0 1 36 0 v22 a9 9 0 0 1-9 9 H41 a9 9 0 0 1-9-9 Z"/>
        <path d="M44 38 h12 v8 H44 Z"/>
        <rect x="40" y="25" width="20" height="13" rx="3"/>
        <path d="M60 31 h8 a5 5 0 0 1 5 5 v4"/>
        <circle cx="73" cy="45" r="4.5"/>
        <rect x="41" y="62" width="18" height="13" rx="2"/>
      </symbol>

      <!-- 精华：滴管瓶 + 液位线 -->
      <symbol id="ic-dropper" viewBox="0 0 100 100">
        <path d="M35 52 a15 15 0 0 1 30 0 v24 a9 9 0 0 1-9 9 H44 a9 9 0 0 1-9-9 Z"/>
        <path d="M44 40 h12 v6 H44 Z"/>
        <rect x="38" y="20" width="24" height="20" rx="6"/>
        <path d="M44 26 h12"/>
        <path d="M37 68 h26"/>
      </symbol>

      <!-- 面霜罐：带压边的盖 + 圆底罐身 -->
      <symbol id="ic-jar" viewBox="0 0 100 100">
        <rect x="27" y="28" width="46" height="15" rx="4"/>
        <path d="M27 36 H73"/>
        <path d="M32 43 v24 a11 11 0 0 0 11 11 h14 a11 11 0 0 0 11-11 V43"/>
      </symbol>

      <!-- 化妆刷：刷头 + 双圈金属箍 + 收腰刷柄 -->
      <symbol id="ic-brush" viewBox="0 0 100 100">
        <path d="M38 48 C34 32 42 16 50 16 C58 16 66 32 62 48 Z"/>
        <path d="M45 20 V46 M55 20 V46"/>
        <rect x="39" y="48" width="22" height="12" rx="2"/>
        <path d="M39 54 H61"/>
        <path d="M44 60 v18 a6 6 0 0 0 12 0 V60"/>
      </symbol>

      <!-- 粉饼盒：外圈 + 内盘 + 卡扣 + 镜面弧光 -->
      <symbol id="ic-compact" viewBox="0 0 100 100">
        <circle cx="50" cy="55" r="28"/>
        <circle cx="50" cy="55" r="20"/>
        <path d="M42 23 h16 a2 2 0 0 1 2 2 v4 H40 v-4 a2 2 0 0 1 2-2 Z"/>
      </symbol>

      <!-- 眼影盘：三色盘 + 上盖分界 + 眼影棒 -->
      <symbol id="ic-palette" viewBox="0 0 100 100">
        <rect x="14" y="28" width="72" height="42" rx="6"/>
        <path d="M14 38 H86"/>
        <circle cx="32" cy="54" r="9"/>
        <circle cx="50" cy="54" r="9"/>
        <circle cx="68" cy="54" r="9"/>
      </symbol>

      <!-- 睫毛膏：螺旋刷杆 + 管身 -->
      <symbol id="ic-mascara" viewBox="0 0 100 100">
        <rect x="43" y="13" width="14" height="39" rx="6"/>
        <path d="M43 20 l14 6 M43 28 l14 6 M43 36 l14 6 M43 44 l14 6"/>
        <path d="M42 52 h16 v29 a6 6 0 0 1-6 6 h-4 a6 6 0 0 1-6-6 Z"/>
      </symbol>

      <!-- 指甲油：斜肩瓶 + 刷盖 -->
      <symbol id="ic-polish" viewBox="0 0 100 100">
        <path d="M36 54 l5-8 V40 h18 v6 l5 8 v27 a5 5 0 0 1-5 5 H41 a5 5 0 0 1-5-5 Z"/>
        <rect x="42" y="15" width="16" height="25" rx="3"/>
        <path d="M42 23 h16"/>
      </symbol>

      <!-- 软管：咬合口 + 管身 -->
      <symbol id="ic-tube" viewBox="0 0 100 100">
        <path d="M36 30 h28 v44 a11 11 0 0 1-11 11 H47 a11 11 0 0 1-11-11 Z"/>
        <path d="M36 30 v-7 h28 v7"/>
        <path d="M43 23 v7 M50 23 v7 M57 23 v7"/>
        <path d="M36 44 h28"/>
      </symbol>

      <!-- 眉笔（赫眉本行）：削尖笔头 + 笔身刻线 -->
      <symbol id="ic-pencil" viewBox="0 0 100 100">
        <path d="M44 22 h12 v56 l-6 12 -6-12 Z"/>
        <path d="M44 70 h12"/>

      <!-- 眉形：轮廓 + 眉毛走向 -->
      <symbol id="ic-brow" viewBox="0 0 100 100">

        <path d="M18 62 C32 48 60 46 80 62 C60 78 34 78 18 62 Z"/>
        <circle cx="49" cy="62" r="8"/>

      <!-- 手持镜 -->
      <symbol id="ic-mirror" viewBox="0 0 100 100">
        <ellipse cx="50" cy="37" rx="23" ry="25"/>
        <ellipse cx="50" cy="37" rx="16" ry="18"/>
        <rect x="45" y="61" width="10" height="26" rx="5"/>
        <path d="M40 30 a12 13 0 0 1 8-7"/>

      <!-- 山茶花：五瓣 + 花心 -->
      <symbol id="ic-flower" viewBox="0 0 100 100">
        <path d="M50 16 C59 26 59 37 50 47 C41 37 41 26 50 16 Z"/>
        <path d="M50 16 C59 26 59 37 50 47 C41 37 41 26 50 16 Z" transform="rotate(72 50 50)"/>
        <path d="M50 16 C59 26 59 37 50 47 C41 37 41 26 50 16 Z" transform="rotate(144 50 50)"/>
        <path d="M50 16 C59 26 59 37 50 47 C41 37 41 26 50 16 Z" transform="rotate(216 50 50)"/>
        <path d="M50 16 C59 26 59 37 50 47 C41 37 41 26 50 16 Z" transform="rotate(288 50 50)"/>
        <circle cx="50" cy="50" r="6"/>
      </symbol>

      <!-- 水滴 + 高光 -->
      <symbol id="ic-drop" viewBox="0 0 100 100">
        <path d="M50 14 C50 14 72 44 72 60 a22 22 0 0 1-44 0 C28 44 50 14 50 14 Z"/>
        <path d="M37 61 a13 13 0 0 0 8 12"/>
      </symbol>

      <!-- 面膜 -->
      <symbol id="ic-mask" viewBox="0 0 100 100">
        <path d="M50 13 C29 13 22 32 22 50 c0 20 13 36 28 36 s28-16 28-36 c0-18-7-37-28-37 Z"/>
        <rect x="30" y="41" width="16" height="8" rx="4"/>
        <rect x="54" y="41" width="16" height="8" rx="4"/>
        <rect x="41" y="63" width="18" height="8" rx="4"/>
        <path d="M50 52 v6"/>
      </symbol>

      <!-- 化妆棉：车缝虚线 -->
      <symbol id="ic-cotton" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="30"/>
        <circle cx="50" cy="50" r="22" stroke-dasharray="4 6"/>
      </symbol>

      <!-- 四角星微光 -->
      <symbol id="ic-star" viewBox="0 0 100 100">
        <path d="M50 12 C54 36 64 46 88 50 C64 54 54 64 50 88 C46 64 36 54 12 50 C36 46 46 36 50 12 Z"/>
      </symbol>
    </defs>
  </svg>

  <canvas id="bg"></canvas>
  <div id="pattern" aria-hidden="true"></div>

  <div class="logo"><img src="assets/logo-hymn.png" alt="赫眉 HYMN"></div>

  <div class="clock" id="clock">
    <div class="card single" data-unit="h">
      <div class="meridiem" id="meridiem">AM</div>
      <div class="half top"><span>0</span></div>
      <div class="half bottom"><span>0</span></div>
      <div class="half top flip-top"><span>0</span></div>
      <div class="half bottom flip-bottom"><span>0</span></div>
    </div>
    <div class="card" data-unit="m">
      <div class="half top"><span>00</span></div>
      <div class="half bottom"><span>00</span></div>
      <div class="half top flip-top"><span>00</span></div>
      <div class="half bottom flip-bottom"><span>00</span></div>
    </div>
    <div class="card" data-unit="s">
      <div class="half top"><span>00</span></div>
      <div class="half bottom"><span>00</span></div>
      <div class="half top flip-top"><span>00</span></div>
      <div class="half bottom flip-bottom"><span>00</span></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="flash"></div>

  <div class="panel" id="panel">
    <div class="panel-box">
      <div class="panel-title">设置倒计时</div>
      <div class="time-inputs">
        <input id="inH" type="text" inputmode="numeric" maxlength="2" value="00">
        <div class="colon">:</div>
        <input id="inM" type="text" inputmode="numeric" maxlength="2" value="05">
        <div class="colon">:</div>
        <input id="inS" type="text" inputmode="numeric" maxlength="2" value="00">
      </div>
      <div class="unit-row"><span>时</span><i class="sp"></i><span>分</span><i class="sp"></i><span>秒</span></div>
      <div class="presets" id="presets"></div>
      <div class="until">
        <span>或者 到</span>
        <input id="inUH" type="text" inputmode="numeric" maxlength="2" placeholder="时">
        <i>:</i>
        <input id="inUM" type="text" inputmode="numeric" maxlength="2" placeholder="分">
        <span>结束</span>
      </div>
      <div class="until-hint" id="untilHint"></div>
      <div class="panel-actions">
        <button class="pbtn" id="cancelBtn">取消</button>
        <button class="pbtn primary" id="startBtn">开始</button>
      </div>
    </div>
  </div>

  <div class="menu" id="bgMenu"></div>

  <div class="controls">
    <button class="btn" id="modeBtn">倒计时</button>
    <button class="btn hidden" id="setBtn">设置</button>
    <button class="btn icon hidden" id="playBtn" title="开始 / 暂停（空格）">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="btn icon hidden" id="stopBtn" title="重置（R）">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
    </button>
    <div class="swatches" id="swatches"></div>
    <button class="btn" id="bgBtn">背景</button>
    <button class="btn" id="fmtBtn">12H</button>
    <button class="btn fsb" id="fsBtn" title="全屏（F）">
      <svg viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg><span>全屏</span>
    </button>
  </div>

<script>
(function(){
  /* ---------- 翻页逻辑 ---------- */
  const cards = {};
  document.querySelectorAll('.card').forEach(el=>{
    cards[el.dataset.unit] = {
      el,
      top:    el.querySelector('.top:not(.flip-top) span'),
      bottom: el.querySelector('.bottom:not(.flip-bottom) span'),
      fTop:   el.querySelector('.flip-top span'),
      fBottom:el.querySelector('.flip-bottom span'),
      value:  null
    };
  });

  function setValue(c, next){
    if(c.value === next) return;
    const prev = c.value;
    c.value = next;

    if(prev === null){                       // 首次渲染，不做动画
      c.top.textContent = c.bottom.textContent = next;
      c.fTop.textContent = c.fBottom.textContent = next;
      return;
    }
    c.fTop.textContent    = prev;            // 往下翻的那一片：旧数字上半
    c.fBottom.textContent = next;            // 翻下来盖住的：新数字下半
    c.top.textContent     = next;            // 静态上半立刻换成新数字
    c.bottom.textContent  = prev;            // 静态下半保持旧数字，等被盖住

    c.el.classList.remove('flipping');
    void c.el.offsetWidth;                   // 重启动画
    c.el.classList.add('flipping');

    setTimeout(()=>{ c.bottom.textContent = next; }, 520);
  }

  /* ---------- 时间 ---------- */
  const meridiem = document.getElementById('meridiem');
  const fmtBtn   = document.getElementById('fmtBtn');
  let use24 = localStorage.getItem('fc-24') === '1';

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function show(h, m, s, hStr){
    const hs = hStr !== undefined ? hStr : pad(h);
    cards.h.el.classList.toggle('single', hs.length === 1);
    setValue(cards.h, hs);
    setValue(cards.m, pad(m));
    setValue(cards.s, pad(s));
  }

  function renderClock(){
    const d = new Date();
    let h = d.getHours();

    if(use24){
      meridiem.classList.add('hidden');
    }else{
      meridiem.classList.remove('hidden');
      meridiem.textContent = h < 12 ? 'AM' : 'PM';
      h = h % 12;
      if(h === 0) h = 12;
    }
    show(h, d.getMinutes(), d.getSeconds(), use24 ? pad(h) : String(h));
  }

  function applyFmt(){
    fmtBtn.textContent = use24 ? '24H' : '12H';
    cards.h.value = null;               // 切换制式时直接重置，不做翻页
    render();
  }
  fmtBtn.addEventListener('click', ()=>{
    use24 = !use24;
    localStorage.setItem('fc-24', use24 ? '1' : '0');
    applyFmt();
  });

  /* ---------- 倒计时 ---------- */
  const modeBtn = document.getElementById('modeBtn');
  const setBtn  = document.getElementById('setBtn');
  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const panel   = document.getElementById('panel');
  const inH = document.getElementById('inH'),
        inM = document.getElementById('inM'),
        inS = document.getElementById('inS');

  const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

  let mode    = localStorage.getItem('fc-mode') === 'timer' ? 'timer' : 'clock';
  let setMs   = +(localStorage.getItem('fc-setms') || 5 * 60 * 1000);  // 默认 5 分钟
  let remain  = setMs;
  let running = false;
  let endAt   = 0;

  function renderTimer(){
    if(running){
      remain = Math.max(0, endAt - Date.now());
      if(remain === 0) finish();
    }
    const total = Math.ceil(remain / 1000);           // 向上取整：5:00 起步，归零即到点
    if(running && total >= 1 && total <= 15 && total !== lastTick && remain > 0) tick(total);
    lastTick = total;
    const h = Math.floor(total / 3600),
          m = Math.floor(total % 3600 / 60),
          s = total % 60;
    meridiem.classList.add('hidden');
    show(h, m, s, h < 10 ? String(h) : pad(h));
    document.title = (running ? '' : '⏸ ') + (h ? h + ':' : '') + pad(m) + ':' + pad(s) + ' · 倒计时';
  }

  function render(){ mode === 'timer' ? renderTimer() : renderClock(); }

  function finish(){
    running = false;
    remain  = 0;
    syncBtns();
    document.body.classList.add('alarm');
    setTimeout(()=>document.body.classList.remove('alarm'), 6200);
    beep();
  }

  let actx = null;
  function audio(){
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
    }catch(e){}
    return actx;
  }
  // 最后 15 秒每秒滴一声，最后 5 秒更高更响
  function tick(sec){
    const ctx = audio(); if(!ctx) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = sec <= 5 ? 1320 : 990;
    o.connect(g); g.connect(ctx.destination);
    const v = sec <= 5 ? .32 : .2;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + .01);
    g.gain.exponentialRampToValueAtTime(.001, t + .12);
    o.start(t); o.stop(t + .14);
  }
  let lastTick = 0;
  function beep(){
    try{
      const ctx = audio(); if(!ctx) return;
      [0, .5, 1].forEach(t=>{
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0, ctx.currentTime + t);
        g.gain.linearRampToValueAtTime(.35, ctx.currentTime + t + .02);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + t + .3);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .32);
      });
    }catch(e){}
  }

  function start(){
    if(remain <= 0) remain = setMs;
    if(remain <= 0) return;
    endAt = Date.now() + remain;
    lastTick = Math.ceil(remain / 1000);            // 开始那一秒不响，从下一秒算
    audio();                                        // 点按时解锁声音（手机/Safari 需要）
    running = true;
    document.body.classList.remove('alarm');
    syncBtns(); render();
  }
  function pause(){
    if(!running) return;
    remain = Math.max(0, endAt - Date.now());
    running = false;
    syncBtns(); render();
  }
  function toggleRun(){ running ? pause() : start(); }
  function reset(){
    running = false;
    remain  = setMs;
    document.body.classList.remove('alarm');
    syncBtns(); render();
  }

  function syncBtns(){
    playBtn.querySelector('svg').innerHTML = running ? ICON_PAUSE : ICON_PLAY;
  }

  function applyMode(){
    const isTimer = mode === 'timer';
    document.body.classList.toggle('timer', isTimer);
    modeBtn.textContent = isTimer ? '时钟' : '倒计时';
    modeBtn.title = isTimer ? '切回时钟' : '切到倒计时';
    [setBtn, playBtn, stopBtn].forEach(b=>b.classList.toggle('hidden', !isTimer));
    fmtBtn.classList.toggle('hidden', isTimer);
    if(!isTimer){ running = false; document.title = 'Flip Clock'; }
    Object.values(cards).forEach(c=>c.value = null);   // 换模式不做翻页动画
    syncBtns(); render();
    localStorage.setItem('fc-mode', mode);
  }

  modeBtn.addEventListener('click', ()=>{
    mode = mode === 'timer' ? 'clock' : 'timer';
    applyMode();
    if(mode === 'timer' && !running) openPanel();
  });
  playBtn.addEventListener('click', toggleRun);
  stopBtn.addEventListener('click', reset);
  setBtn .addEventListener('click', openPanel);
  document.getElementById('clock').addEventListener('click', ()=>{
    if(mode === 'timer' && !running) openPanel();
  });

  /* 设置面板 */
  function openPanel(){
    const total = Math.round((running ? remain : setMs) / 1000);
    inH.value = pad(Math.floor(total / 3600));
    inM.value = pad(Math.floor(total % 3600 / 60));
    inS.value = pad(total % 60);
    clearUntil();
    panel.classList.add('show');
    setTimeout(()=>{ inM.focus(); inM.select(); }, 30);
  }
  function closePanel(){ panel.classList.remove('show'); }

  function readInputs(){
    const n = v => Math.max(0, Math.min(99, parseInt(v, 10) || 0));
    return (n(inH.value) * 3600 + n(inM.value) * 60 + n(inS.value)) * 1000;
  }
  function applyPanel(andStart){
    const u = untilMs();
    if(u) fillFromMs(u);                        // 按「到几点」时，以点开始这一刻重新算一次
    const ms = u || readInputs();
    if(ms <= 0) return;
    setMs  = ms;
    remain = ms;
    localStorage.setItem('fc-setms', ms);
    closePanel();
    if(mode !== 'timer'){ mode = 'timer'; applyMode(); }
    andStart ? start() : (syncBtns(), render());
  }
  document.getElementById('startBtn').addEventListener('click', ()=>applyPanel(true));
  document.getElementById('cancelBtn').addEventListener('click', closePanel);
  panel.addEventListener('click', e=>{ if(e.target === panel) closePanel(); });

  /* 到几点结束 → 自动算时长 */
  const inUH = document.getElementById('inUH'), inUM = document.getElementById('inUM'),
        untilHint = document.getElementById('untilHint');
  function untilMs(){
    if(inUH.value === '') return 0;
    const h = parseInt(inUH.value, 10), m = parseInt(inUM.value || '0', 10);
    if(!(h >= 0 && h <= 23 && m >= 0 && m <= 59)) return 0;
    const now = new Date(), t = new Date(now);
    t.setHours(h, m, 0, 0);
    if(t <= now) t.setDate(t.getDate() + 1);     // 已经过了就算明天这个点
    return t - now;
  }
  function fillFromMs(ms){
    const total = Math.ceil(ms / 1000);
    inH.value = pad(Math.min(99, Math.floor(total / 3600)));
    inM.value = pad(Math.floor(total % 3600 / 60));
    inS.value = pad(total % 60);
  }
  function updateUntil(){
    const ms = untilMs();
    if(!ms){
      untilHint.textContent = inUH.value === '' ? '' : '时间不对：时 0–23，分 0–59';
      return;
    }
    fillFromMs(ms);
    const total = Math.ceil(ms / 1000), h = Math.floor(total / 3600), m = Math.floor(total % 3600 / 60);
    const end = new Date(Date.now() + ms), tomorrow = end.getDate() !== new Date().getDate();
    untilHint.textContent = (tomorrow ? '明天 ' : '') + pad(end.getHours()) + ':' + pad(end.getMinutes())
      + ' 结束 · 还有 ' + (h ? h + ' 小时 ' : '') + m + ' 分' + (h ? '' : ' ' + (total % 60) + ' 秒');
  }
  function clearUntil(){ inUH.value = ''; inUM.value = ''; untilHint.textContent = ''; }
  [inUH, inUM].forEach((el,i,arr)=>{
    el.addEventListener('focus', ()=>el.select());
    el.addEventListener('input', ()=>{
      el.value = el.value.replace(/\D/g,'').slice(0,2);
      if(el.value.length === 2 && arr[i+1]) arr[i+1].focus();
      updateUntil();
    });
    el.addEventListener('keydown', e=>{ if(e.key === 'Enter') applyPanel(true); });
  });

  [inH, inM, inS].forEach((el,i,arr)=>{
    el.addEventListener('focus', ()=>el.select());
    el.addEventListener('input', ()=>{
      clearUntil();                              // 手动改时长就不再按「到几点」
      el.value = el.value.replace(/\D/g,'').slice(0,2);
      if(el.value.length === 2 && arr[i+1]) arr[i+1].focus();
    });
    el.addEventListener('keydown', e=>{ if(e.key === 'Enter') applyPanel(true); });
  });

  // 快捷时长
  const PRESETS = [1, 3, 5, 10, 15, 20, 30, 45, 60, 90];
  const presetBox = document.getElementById('presets');
  PRESETS.forEach(min=>{
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = min < 60 ? min + ' 分' : (min / 60) + ' 小时';
    b.addEventListener('click', ()=>{
      inH.value = pad(Math.floor(min / 60));
      inM.value = pad(min % 60);
      inS.value = '00';
      clearUntil();
    });
    presetBox.appendChild(b);
  });

  applyFmt();
  applyMode();
  setInterval(render, 100);             // 100ms 一跳，秒变化几乎无延迟

  /* ---------- 背景色 ---------- */
  let bgFx = null;

  // g = 背景流光的三个色（底色 / 亮部 / 光晕）
  const themes = [
    {bg:'#eaa8b1', card:'#e2949f', digit:'#ffffff', line:'rgba(255,255,255,.28)',
     g:['#d4808f','#fbd9dd','#f4b39c']},                                            // 赫眉粉（默认）
    {bg:'#eaa8b1', card:'#d98794', digit:'#ffffff', line:'rgba(255,255,255,.3)',
     g:['#c96e83','#f9cdd6','#e79ac6']},                                            // 粉底·玫瑰
    {bg:'#f2c3c8', card:'#e9a8b1', digit:'#ffffff', line:'rgba(255,255,255,.35)',
     g:['#eab0b8','#fff0f1','#f7c9ad']},                                            // 浅粉·奶油
    {bg:'#000000', card:'#191919', digit:'#ffffff', line:'rgba(255,255,255,.08)',
     g:['#08060b','#43284b','#a13a6b']},                                            // 纯黑·暗夜
    {bg:'#0e1116', card:'#1a1a1a', digit:'#ffffff', line:'rgba(255,255,255,.08)',
     g:['#0a0e14','#22405c','#2f8f93']},                                            // 石墨·极光
    {bg:'#2b1c20', card:'#3a262b', digit:'#ffffff', line:'rgba(255,255,255,.14)',
     g:['#1d1215','#6b3947','#c25a6e']}                                             // 深酒红
  ];
  const box = document.getElementById('swatches');
  let current = +(localStorage.getItem('fc-theme') || 0);

  function applyTheme(i){
    const t = themes[i] || themes[0];
    const r = document.documentElement.style;
    r.setProperty('--bg', t.bg);
    r.setProperty('--card', t.card);
    r.setProperty('--digit', t.digit);
    r.setProperty('--line', t.line);
    box.querySelectorAll('.sw').forEach((b,k)=>b.classList.toggle('on', k === i));
    localStorage.setItem('fc-theme', i);
    current = i;
    if(bgFx) bgFx.setColors(t.g, t.bg);
  }
  themes.forEach((t,i)=>{
    const b = document.createElement('button');
    b.className = 'sw';
    b.style.background = t.bg;
    b.title = '背景色 ' + (i+1);
    b.addEventListener('click', ()=>applyTheme(i));
    box.appendChild(b);
  });
  applyTheme(current);

  /* ================= 背景：彩妆图案 + 6 套 shader，可自由切换 ================= */
  const SHADERS = {
    silk: `
      precision highp float;
      uniform vec2  u_res;
      uniform float u_t;
      uniform vec3  u_c1;   // 底色
      uniform vec3  u_c2;   // 亮部
      uniform vec3  u_c3;   // 光晕

      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

      float noise(vec2 p){
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
      }

      float fbm(vec2 p){
        float a = 0.5, s = 0.0;
        for(int i = 0; i < 5; i++){ s += a * noise(p); p *= 2.03; a *= 0.5; }
        return s;
      }

      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
        float t = u_t * 0.05;

        // 两次域扭曲：出来的是缓慢流动的丝绸/极光
        vec2 q = vec2(fbm(uv * 1.3 + vec2(0.0, t)),
                      fbm(uv * 1.3 + vec2(3.2, -t)));
        vec2 r = vec2(fbm(uv * 1.7 + 2.6 * q + vec2(1.7, 9.2) + 0.18 * t),
                      fbm(uv * 1.7 + 2.6 * q + vec2(8.3, 2.8) - 0.15 * t));
        float f = fbm(uv * 1.5 + 2.4 * r);

        vec3 col = mix(u_c1, u_c2, smoothstep(0.10, 0.92, f * f * 1.9));
        col = mix(col, u_c3, clamp(dot(q, q) * 1.15, 0.0, 1.0));
        col = mix(col, u_c2, clamp(r.x * r.x * 0.7, 0.0, 1.0));

        // 一道游动的高光丝带，给流光加"绸缎"质感
        float band = pow(max(0.0, 1.0 - abs(r.y - 0.55) * 3.2), 5.0);
        col += band * 0.16 * u_c2;

        // 4 个带景深的光球：z 越小越大越亮 —— 立体感来源
        for(int i = 0; i < 4; i++){
          float fi = float(i);
          float z  = 1.7 + 1.15 * sin(t * 1.9 + fi * 1.7);
          vec2  c  = vec2(sin(t * 1.25 + fi * 2.1) * 1.05,
                          cos(t * 0.95 + fi * 1.4) * 0.6);
          float rad = 0.62 / z;
          float d   = length(uv - c / z * 1.5) / rad;
          col += exp(-d * d * 2.0) * mix(u_c3, u_c2, 0.45) * (0.30 / z);
        }

        col *= 0.97 - 0.42 * dot(uv, uv);                      // 暗角
        col += (hash(gl_FragCoord.xy + fract(u_t)) - 0.5) * 0.014;  // 抖动去色带
        gl_FragColor = vec4(col, 1.0);
      }`,
    dust: `
      precision highp float;
      uniform vec2  u_res;
      uniform float u_t;
      uniform vec3  u_bg;   // 品牌底色
      uniform vec3  u_c1;   // 暗部
      uniform vec3  u_c2;   // 亮部
      uniform vec3  u_c3;   // 点缀

      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

      // ② 星尘微光：三层不同景深的小光点缓慢飘移，近的快、远的慢，靠视差出立体
      void main(){
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;

        vec3 col = mix(u_bg, u_c1, smoothstep(-0.45, 0.85, -uv.y) * 0.30);
        col = mix(col, u_c2, exp(-dot(uv, uv) * 1.6) * 0.10);

        float dust = 0.0;
        for(int i = 0; i < 3; i++){
          float fi = float(i);
          float depth = 1.0 + fi * 0.95;
          vec2 g = uv * (6.5 + fi * 5.5)
                 + vec2(u_t * 0.055 / depth, -u_t * 0.028 / depth);
          vec2 id = floor(g), f = fract(g) - 0.5;
          float h = hash(id + fi * 31.7);
          if(h > 0.70){
            vec2 off = vec2(hash(id + 7.1), hash(id + 3.3)) - 0.5;
            float d  = length(f - off * 0.62);
            float tw = 0.55 + 0.45 * sin(u_t * 1.1 + h * 33.0);
            dust += smoothstep(0.085, 0.0, d) * tw / depth;
          }
        }
        col = mix(col, u_c2, clamp(dust, 0.0, 1.0) * 0.55);

        col *= 1.0 - 0.24 * dot(uv, uv);
        col += (hash(gl_FragCoord.xy + fract(u_t)) - 0.5) * 0.012;
        gl_FragColor = vec4(col, 1.0);
      }
`
  };

  bgFx = (function(){

    /* ---------- A. 彩妆 / 护肤图案层（纯 CSS transform） ---------- */
    const layer = document.getElementById('pattern');
    const ICONS = ['lipstick','perfume','dropper','jar','brush','compact','palette',
                   'mascara','polish','tube','pencil','brow','mirror','flower',
                   'drop','mask','cotton'];

    // 三档景深：越"远"越小、越淡、飘得越慢
    const DEPTH = [
      {size:170, opacity:.26, dur:56},
      {size:122, opacity:.19, dur:74},
      {size: 86, opacity:.13, dur:96}
    ];

    const N = 24;
    let frag = document.createDocumentFragment();
    let k = 0;                                   // 单独计数，保证 17 个图标全都轮得到
    for(let i = 0; i < N; i++){
      const d    = DEPTH[i % 3];
      const dur  = d.dur + (i * 5.7) % 22;
      const sway = 7 + (i * 3.3) % 6;
      const left = (i * 100 / N + ((i * 37) % 11) - 5 + 100) % 100;   // 横向铺开 + 抖动

      const star = (i % 5 === 3);                 // 每 5 个掺一颗微光
      const el = document.createElement('div');
      el.className = 'p-item d' + (i % 3) + (star ? ' star' : '');
      el.style.left    = left.toFixed(1) + '%';
      el.style.width   = (star ? d.size * 0.34 : d.size) + 'px';
      el.style.height  = (star ? d.size * 0.34 : d.size) + 'px';
      el.style.opacity = star ? d.opacity * 1.5 : d.opacity;
      el.style.animationDuration = dur.toFixed(1) + 's';
      // 负延迟把它们错开铺满整个纵向循环，一开机就是满屏
      el.style.animationDelay    = (-dur * ((i * 7 % N) / N)).toFixed(1) + 's';
      el.innerHTML =
        '<div class="' + (star ? 'p-star' : 'p-spin') +
        '" style="animation-duration:' + (star ? (sway * 0.55) : sway).toFixed(1) + 's;' +
        'animation-delay:-' + (i * 0.7).toFixed(1) + 's">' +
        '<svg viewBox="0 0 100 100"><use href="#ic-' +
        (star ? 'star' : ICONS[k++ % ICONS.length]) + '"/></svg></div>';
      frag.appendChild(el);
    }
    layer.appendChild(frag);

    /* ---------- B. WebGL 层：一个全屏三角形跑 fragment shader ---------- */
    const cv = document.getElementById('bg');
    const gl = cv.getContext('webgl', {antialias:false, alpha:false, depth:false,
                                       powerPreference:'low-power'});

    const VS = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
    const SCALE = 0.55;                     // 半分辨率渲染，CSS 拉满：省 GPU
    const FPS = 30, STEP = 1000 / FPS;      // 锁 30 帧
    const cache = {};                       // 编译过的 shader 存起来，切回来不用重编
    let cur = null, raf = 0, t0 = performance.now(), last = 0, colors = null;

    if(gl){
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      addEventListener('resize', ()=>{ resize(); if(cur) draw(performance.now()); });
    }

    function compile(type, src){
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src); gl.compileShader(sh);
      if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
        console.warn(gl.getShaderInfoLog(sh)); return null;
      }
      return sh;
    }

    function build(name){
      if(cache[name] !== undefined) return cache[name];
      const vs = compile(gl.VERTEX_SHADER, VS),
            fs = compile(gl.FRAGMENT_SHADER, SHADERS[name]);
      if(!vs || !fs) return (cache[name] = null);
      const prog = gl.createProgram();
      gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
      if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) return (cache[name] = null);
      gl.useProgram(prog);
      const loc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      return (cache[name] = {
        prog,
        res: gl.getUniformLocation(prog, 'u_res'),
        t:   gl.getUniformLocation(prog, 'u_t'),
        bg:  gl.getUniformLocation(prog, 'u_bg'),
        c1:  gl.getUniformLocation(prog, 'u_c1'),
        c2:  gl.getUniformLocation(prog, 'u_c2'),
        c3:  gl.getUniformLocation(prog, 'u_c3')
      });
    }

    function resize(){
      if(!gl || !cur) return;
      const w = Math.max(2, Math.round(innerWidth  * SCALE)),
            h = Math.max(2, Math.round(innerHeight * SCALE));
      if(cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
      gl.viewport(0, 0, w, h);
      gl.uniform2f(cur.res, w, h);
    }

    function hex2rgb(h){
      const n = parseInt(h.slice(1), 16);
      return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
    }
    function pushColors(){
      if(!gl || !cur || !colors) return;
      gl.useProgram(cur.prog);
      gl.uniform3fv(cur.bg, hex2rgb(colors.bg));
      gl.uniform3fv(cur.c1, hex2rgb(colors.g[0]));
      gl.uniform3fv(cur.c2, hex2rgb(colors.g[1]));
      gl.uniform3fv(cur.c3, hex2rgb(colors.g[2]));
    }

    function draw(now){
      gl.uniform1f(cur.t, (now - t0) / 1000);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    function loop(now){
      raf = requestAnimationFrame(loop);
      if(now - last < STEP) return;
      last = now;
      draw(now);
    }
    function stopLoop(){ cancelAnimationFrame(raf); raf = 0; }

    /* ---------- C. 模式切换 ---------- */
    const MODES = [
      {k:'pattern', name:'彩妆图案'},
      {k:'silk',    name:'流光丝绸'},
      {k:'dust',    name:'星尘微光'},
      {k:'none',    name:'纯色（关动效）'}
    ];
    let mode = localStorage.getItem('fc-bgmode') || 'pattern';
    if(!MODES.some(m => m.k === mode)) mode = 'pattern';

    function syncPlay(){
      document.body.classList.toggle('paused', mode !== 'pattern' || document.hidden);
      if(mode === 'pattern' || mode === 'none' || !cur || document.hidden) stopLoop();
      else if(!raf) raf = requestAnimationFrame(loop);
    }

    function apply(){
      const isGL = mode !== 'pattern' && mode !== 'none';
      cur = (isGL && gl) ? build(mode) : null;
      if(isGL && !cur) mode = 'pattern';                 // shader 挂了就退回图案

      layer.classList.toggle('off', mode !== 'pattern');
      cv.classList.toggle('off', !cur);
      if(cur){ gl.useProgram(cur.prog); resize(); pushColors(); }
      syncPlay();

      localStorage.setItem('fc-bgmode', mode);
      const item = MODES.find(m => m.k === mode);
      bgBtn.textContent = item ? item.name : '背景';
      menu.querySelectorAll('button').forEach(b =>
        b.classList.toggle('on', b.dataset.k === mode));
    }

    document.addEventListener('visibilitychange', syncPlay);

    /* ---------- D. 菜单 ---------- */
    const bgBtn = document.getElementById('bgBtn');
    const menu  = document.getElementById('bgMenu');
    MODES.forEach(m =>{
      if(m.k !== 'pattern' && m.k !== 'none' && !gl) return;   // 没有 WebGL 就不列
      const b = document.createElement('button');
      b.textContent = m.name;
      b.dataset.k = m.k;
      b.addEventListener('click', ()=>{ mode = m.k; apply(); menu.classList.remove('show'); });
      menu.appendChild(b);
    });
    bgBtn.addEventListener('click', e =>{
      e.stopPropagation();
      menu.classList.toggle('show');
      bgBtn.classList.toggle('on', menu.classList.contains('show'));
    });
    document.addEventListener('click', ()=>{
      menu.classList.remove('show'); bgBtn.classList.remove('on');
    });
    menu.addEventListener('click', e => e.stopPropagation());

    apply();                                   // 按上次记住的模式开机

    return {
      setColors(g, bg){ colors = {g:g, bg:bg}; pushColors(); },
      closeMenu(){ menu.classList.remove('show'); bgBtn.classList.remove('on'); }
    };
  })();

  bgFx.setColors(themes[current].g, themes[current].bg);

  /* ---------- 全屏 & 自动隐藏控件 ---------- */
  document.getElementById('fsBtn').addEventListener('click', toggleFs);
  const fsBtn = document.getElementById('fsBtn'), fsTxt = fsBtn.querySelector('span');
  const fsPath = fsBtn.querySelector('path');
  const fsEl = ()=> document.fullscreenElement || document.webkitFullscreenElement;
  const fsOk = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  function toggleFs(){
    const d = document, el = d.documentElement;
    if(!fsOk){ toast('iPhone 不支持网页全屏：点「分享」→「添加到主屏幕」，从桌面图标打开即全屏'); return; }
    if(fsEl()) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
  function syncFs(){
    const on = !!fsEl();
    fsTxt.textContent = on ? '退出全屏' : '全屏';
    fsPath.setAttribute('d', on ? 'M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6' : 'M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6');
  }
  document.addEventListener('fullscreenchange', syncFs);
  document.addEventListener('webkitfullscreenchange', syncFs);
  let toastT;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 4000);
  }
  document.addEventListener('keydown', e=>{
    if(e.target.tagName === 'INPUT'){                       // 面板里打字时不抢按键
      if(e.key === 'Escape') closePanel();
      return;
    }
    if(e.key === 'f' || e.key === 'F') toggleFs();
    if(e.key === 'Escape'){ closePanel(); bgFx && bgFx.closeMenu(); }
    if(mode === 'timer'){
      if(e.code === 'Space'){ e.preventDefault(); toggleRun(); }
      if(e.key === 'r' || e.key === 'R') reset();
    }
  });

  let timer;
  function wake(){
    document.body.classList.remove('idle');
    clearTimeout(timer);
    timer = setTimeout(()=>document.body.classList.add('idle'), 3000);
  }
  ['mousemove','mousedown','keydown','touchstart'].forEach(ev=>
    document.addEventListener(ev, wake, {passive:true}));
  wake();
})();
</script>
</body>
</html>
